# Dependabot configuration for the portfolio project.
#
# Design goals:
#   - One PR per ecosystem, not many: each `groups` entry batches all matching
#     updates into a single pull request. There are two groups per ecosystem so
#     security fixes and routine version bumps land in their own single PR.
#   - Cadence: version-update PRs are opened/refreshed on Monday only.
#     Vulnerability (security) PRs are raised as soon as an advisory is detected
#     — independent of this schedule — so detection stays fast while routine
#     review burden is weekly.
#
# NOTE on `applies-to`: valid values are ONLY `version-updates` or
# `security-updates` (defaults to `version-updates` when omitted). The value
# `security` is invalid and causes GitHub to reject this file.
# Ref: https://docs.github.com/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2

updates:
  # ── npm / JavaScript dependencies ──────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    # Batch updates into a SINGLE pull request per group.
    groups:
      # All security (advisory-driven) updates for npm deps land in one PR.
      npm-security:
        applies-to: "security-updates"
        update-types:
          - "patch"
          - "minor"
          - "major"
      # All non-security version updates also land in one PR.
      npm-version-updates:
        applies-to: "version-updates"
        update-types:
          - "patch"
          - "minor"
          - "major"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    pull-request-branch-name:
      separator: "-"
    # Pin React to 19.x — the App Router on Next 16 expects React 19.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions workflows ───────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    groups:
      actions-security:
        applies-to: "security-updates"
        update-types:
          - "patch"
          - "minor"
          - "major"
      actions-version-updates:
        applies-to: "version-updates"
        update-types:
          - "patch"
          - "minor"
          - "major"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    pull-request-branch-name:
      separator: "-"
